<style>
  .back-button {
    color: rgb(0, 113, 133);
  }
  .title {
    font-size: 20px;
    font-weight: bold;
  }
  .price {
    font-weight: bold;
    color: rgb(0, 118, 20);
  }
  .text {
    color: gray;
  }
  .cart-button {
    background-color: rgb(255, 216, 20);
    border: none;
    height: 27px;
    width: 105px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color 1s, color 1s;
  }
  .cart-button:hover {
    background-color: black;
    color: white;
  }
  .cart-button:active {
    transform: scale(0.95);
  }
  .buy-button {
    background-color: rgb(255, 164, 28);
    border: none;
    height: 27px;
    width: 105px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color 1s, color 1s;
  }
  .buy-button:hover {
     background-color: black;
    color: white;
  }
  .buy-button:active {
    transform: scale(0.95);
  }

</style>

<a href="https://www.amazon.com/" target="_blank" class="back-button">
  Back to Amazon
</a>
<p class="title">
  Nike Black Running Shoes
</p>
<p class="price">
  $39 - in stock.
</p>
<p class="text">

</p>

</button>

</button>
